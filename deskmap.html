  <!-- Context Menu -->
  <!-- No context menu, direct right-click to delete -->

  <!-- Drag Ghost -->
  <div id="drag-ghost"></div>

  <!-- Batch Add Modal -->
  <div id="batch-modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
      <h3>批量添加人员</h3>
      <p style="font-size:13px;color:#666;margin-bottom:8px;">粘贴姓名清单，用逗号、中文逗号或换行分隔</p>
      <textarea id="batch-input" class="batch-textarea" placeholder="例如：&#10;张三, 李四, 王五&#10;赵六, 钱七, 孙八"></textarea>
      <p style="font-size:12px;color:var(--danger);margin:8px 0 4px;font-weight:600;">请确保已在人员清单中选择了具体的分组。</p>
      <div class="modal-actions">
        <button id="btn-batch-cancel" class="modal-btn">取消</button>
        <button id="btn-batch-confirm" class="modal-btn accent">确认添加</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for import -->
  <input type="file" id="import-file" accept=".json" style="display:none">

  <script>
    (function () {
      // ── Constants ──
      const CELL = 30;
      const SEAT_W = 3 * CELL;  // 90px
      const SEAT_H = 2 * CELL;  // 60px

      const SEAT_ORIENTATIONS = [
        { deg: 0, label: '右 →', cssDeg: 0 },
        { deg: 90, label: '下 ↓', cssDeg: 90 },
        { deg: 180, label: '左 ←', cssDeg: 180 },
        { deg: 270, label: '上 ↑', cssDeg: 270 },
      ];

      function getSeatSize(orientation) {
        // For 90 and 270 degrees, the 90x60 seat is rotated, so its bounding box becomes 60x90
        if (orientation === 90 || orientation === 270) {
          return { w: SEAT_H, h: SEAT_W };
        }
        return { w: SEAT_W, h: SEAT_H };
      }

      function getObjectSize(obj) {
        if (obj.orientation !== undefined) return getSeatSize(obj.orientation);
        return { w: obj.w, h: obj.h };
      }

      function getObjectRect(obj) {
        const size = getObjectSize(obj);
        return { x: obj.x, y: obj.y, w: size.w, h: size.h };
      }

      const OBSTACLE_TEMPLATES = [
        { w: 1, h: 1, label: '1×1' },
        { w: 2, h: 1, label: '2×1' },
        { w: 1, h: 2, label: '1×2' },
        { w: 2, h: 2, label: '2×2' },
        { w: 3, h: 1, label: '3×1' },
        { w: 1, h: 3, label: '1×3' },
        { w: 3, h: 3, label: '3×3' },
      ];

      const PERSON_COLORS = [
        '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
        '#1abc9c', '#e67e22', '#2980b9', '#27ae60', '#c0392b',
        '#8e44ad', '#16a085', '#d35400', '#2c3c50', '#f1c40f',
        '#00bcd4', '#ff5722', '#795548', '#607d8b', '#e91e63',
      ];

      const SCHEMA_VERSION = 2;

      // ── State ──
      let state = {
        version: SCHEMA_VERSION,
        groups: [
          { id: 'g_default', name: '默认分组', color: '#3498db' }
        ],
        people: [],
        seats: [],
        obstacles: [],
        activeGroupId: 'g_default',
        peopleFilterGroupId: 'all'
      };

      let drag = null; // current drag state
      let lastPointerEvent = null; // last known pointer event
      let customObsMode = false; // custom obstacle sizing mode
      let selectedIds = new Set();
      let marquee = null; // { startX, startY }

      // ── DOM refs ──
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);

      const gridArea = $('#grid-area');
      const workspace = $('#workspace');
      const peopleList = $('#people-list');
      const peopleCount = $('#people-count');
      const dragGhost = $('#drag-ghost');
      const selectionMarquee = $('#selection-marquee');
      const emptyHint = $('.empty-hint');
      const newPersonInput = $('#new-person-name');

      // ── ID generation ──
      function genId() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }

      // ── Schema validation ──
      function validateState(data) {
        const errors = [];
        if (!data || typeof data !== 'object') { errors.push('数据无效'); return { valid: false, errors }; }

        const version = data.version;
        if (version !== undefined && version > SCHEMA_VERSION) {
          errors.push(`数据版本 v${version} 不兼容，当前版本 v${SCHEMA_VERSION}`);
        }
        if (!Array.isArray(data.people)) errors.push('people 必须是数组');
        if (!Array.isArray(data.seats)) errors.push('seats 必须是数组');
        if (!Array.isArray(data.obstacles)) errors.push('obstacles 必须是数组');
        
        if (data.version === 2) {
          if (!Array.isArray(data.groups)) errors.push('groups 必须是数组');
          else {
            for (let i = 0; i < data.groups.length; i++) {
              const g = data.groups[i];
              if (typeof g.id !== 'string') errors.push(`groups[${i}].id 必须是字符串`);
              if (typeof g.name !== 'string') errors.push(`groups[${i}].name 必须是字符串`);
              if (typeof g.color !== 'string') errors.push(`groups[${i}].color 必须是字符串`);
            }
          }
          if (typeof data.activeGroupId !== 'string') errors.push('activeGroupId 必须是字符串');
          if (data.peopleFilterGroupId !== undefined && typeof data.peopleFilterGroupId !== 'string') {
            errors.push('peopleFilterGroupId 必须是字符串');
          }
        }

        for (let i = 0; i < (data.people || []).length; i++) {
          const p = data.people[i];
          if (typeof p.id !== 'string') errors.push(`people[${i}].id 必须是字符串`);
          if (typeof p.name !== 'string') errors.push(`people[${i}].name 必须是字符串`);
          if (data.version === 2 && typeof p.groupId !== 'string') errors.push(`people[${i}].groupId 必须是字符串`);
          if ((data.version === 1 || !data.version) && typeof p.color !== 'string') errors.push(`people[${i}].color 必须是字符串`);
        }
        for (let i = 0; i < (data.seats || []).length; i++) {
          const s = data.seats[i];
          if (typeof s.id !== 'string') errors.push(`seats[${i}].id 必须是字符串`);
          if (typeof s.x !== 'number') errors.push(`seats[${i}].x 必须是数字`);
          if (typeof s.y !== 'number') errors.push(`seats[${i}].y 必须是数字`);
          if (typeof s.orientation !== 'number') errors.push(`seats[${i}].orientation 必须是数字`);
          if (s.personId !== null && typeof s.personId !== 'string') errors.push(`seats[${i}].personId 必须是字符串或 null`);
        }
        for (let i = 0; i < (data.obstacles || []).length; i++) {
          const o = data.obstacles[i];
          if (typeof o.id !== 'string') errors.push(`obstacles[${i}].id 必须是字符串`);
          if (typeof o.x !== 'number') errors.push(`obstacles[${i}].x 必须是数字`);
          if (typeof o.y !== 'number') errors.push(`obstacles[${i}].y 必须是数字`);
          if (typeof o.w !== 'number') errors.push(`obstacles[${i}].w 必须是数字`);
          if (typeof o.h !== 'number') errors.push(`obstacles[${i}].h 必须是数字`);
          if (typeof o.name !== 'string') errors.push(`obstacles[${i}].name 必须是字符串`);
        }

        return { valid: errors.length === 0, errors };
      }

      // ── Persistence ──
      const STORAGE_KEY = 'seats-tool-state';

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, version: SCHEMA_VERSION })); } catch (e) { /* quota exceeded */ }
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const result = validateState(parsed);
            if (result.valid) {
              if (parsed.version === 1 || !parsed.version) {
                // Migrate v1 to v2
                const colorToGroupId = {};
                const groups = [];
                parsed.people.forEach(p => {
                  if (!colorToGroupId[p.color]) {
                    const gid = 'g_' + genId();
                    colorToGroupId[p.color] = gid;
                    groups.push({ id: gid, name: '分组 ' + (groups.length + 1), color: p.color });
                  }
                  p.groupId = colorToGroupId[p.color];
                  delete p.color;
                });
                parsed.groups = groups.length > 0 ? groups : [{ id: 'g_default', name: '默认分组', color: '#3498db' }];
                parsed.activeGroupId = parsed.groups[0].id;
                parsed.peopleFilterGroupId = 'all';
                parsed.version = 2;
                delete parsed.nextColorIdx;
              }
              // Ensure UI state defaults if missing in imported file
              if (!parsed.peopleFilterGroupId) parsed.peopleFilterGroupId = 'all';
              state = parsed;
            }
          }
        } catch (e) { console.error('Load state failed', e); }
      }

      function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'seat-plan-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      function importData(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const result = validateState(parsed);
            if (!result.valid) {
              alert('导入失败:\n' + result.errors.join('\n'));
              return;
            }
            state = parsed;
            state.version = SCHEMA_VERSION;
            saveState();
            renderAll();
          } catch (e) {
            alert('导入失败：文件格式不正确');
          }
        };
        reader.readAsText(file);
      }

      // ── Collision detection ──
      function rectsOverlap(a, b) {
        return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
      }

      function checkCollision(x, y, w, h, excludeIds) {
        const r1 = { x, y, w, h };
        const excludes = (excludeIds instanceof Set) ? excludeIds : (Array.isArray(excludeIds) ? new Set(excludeIds) : new Set([excludeIds]));
        for (const s of state.seats) {
          if (excludes.has(s.id)) continue;
          if (rectsOverlap(r1, getObjectRect(s))) return true;
        }
        for (const o of state.obstacles) {
          if (excludes.has(o.id)) continue;
          if (rectsOverlap(r1, getObjectRect(o))) return true;
        }
        return false;
      }

      function findObjectAt(gx, gy) {
        for (const s of state.seats) {
          const r = getObjectRect(s);
          if (gx >= r.x && gx < r.x + r.w && gy >= r.y && gy < r.y + r.h) return { type: 'seat', data: s };
        }
        for (const o of state.obstacles) {
          const r = getObjectRect(o);
          if (gx >= r.x && gx < r.x + r.w && gy >= r.y && gy < r.y + r.h) return { type: 'obstacle', data: o };
        }
        return null;
      }

      function findSeatAt(gx, gy) {
        const obj = findObjectAt(gx, gy);
        return (obj && obj.type === 'seat') ? obj.data : null;
      }

      function getPerson(id) { return state.people.find(p => p.id === id); }
      function getGroup(id) { return state.groups.find(g => g.id === id) || state.groups[0]; }

      // ── Color picker ──
      function renderColorPicker(container, selectedColor, availableColors, onSelect) {
        container.innerHTML = '';
        const colors = availableColors || PERSON_COLORS;
        for (const c of colors) {
          const dot = document.createElement('span');
          dot.className = 'color-dot-opt' + (c === selectedColor ? ' selected' : '');
          dot.style.background = c;
          dot.addEventListener('click', (e) => { e.stopPropagation(); onSelect(c); });
          container.appendChild(dot);
        }
      }

      function getUsedGroupColors(excludeGroupId) {
        return new Set(state.groups.filter(g => g.id !== excludeGroupId).map(g => g.color));
      }

      // ── Rendering ──
      function updateEmptyHint() {
        emptyHint.style.display = (state.seats.length === 0 && state.obstacles.length === 0) ? '' : 'none';
      }

      function updateGridSize() {
        let maxX = 1800, maxY = 1200;
        for (const s of state.seats) {
          maxX = Math.max(maxX, s.x + SEAT_W + 120);
          maxY = Math.max(maxY, s.y + SEAT_H + 120);
        }
        for (const o of state.obstacles) {
          maxX = Math.max(maxX, o.x + o.w + 120);
          maxY = Math.max(maxY, o.y + o.h + 120);
        }
        gridArea.style.minWidth = maxX + 'px';
        gridArea.style.minHeight = maxY + 'px';
      }

      function updatePeopleCount() {
        const assigned = state.seats.filter(s => s.personId).length;
        peopleCount.textContent = `(${state.people.length}人，${assigned}人已入座)`;
      }

      function renderGroupList() {
        const groupContainer = $('#group-list');
        groupContainer.innerHTML = '';
        
        // Also update the filter dropdown in People tab
        const filterSelect = $('#people-group-filter');
        const currentFilter = state.peopleFilterGroupId || 'all';
        filterSelect.innerHTML = '<option value="all">全部显示</option>';
        
        state.groups.forEach(g => {
          // Render Groups tab items
          const count = state.people.filter(p => p.groupId === g.id).length;
          const el = document.createElement('div');
          el.className = 'group-item' + (state.activeGroupId === g.id ? ' active' : '');
          el.innerHTML = `
            <div class="color-dot" style="background:${g.color}"></div>
            <div class="group-name" contenteditable="true">${escHtml(g.name)}</div>
            <div class="member-count">${count}</div>
            <div class="delete-group" title="删除分组">×</div>
          `;
          
          el.addEventListener('click', () => {
            state.activeGroupId = g.id;
            renderGroupList();
          });
          
          const nameEl = el.querySelector('.group-name');
          nameEl.addEventListener('blur', () => {
            const newName = nameEl.textContent.trim() || '未命名分组';
            if (newName !== g.name) {
              g.name = newName;
              saveState();
              renderAll();
            }
          });
          nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
          nameEl.addEventListener('click', (e) => e.stopPropagation());
          
          el.querySelector('.color-dot').addEventListener('click', (e) => {
            e.stopPropagation();
            showColorEditPopup(g.id, e.currentTarget, 'group');
          });
          
          el.querySelector('.delete-group').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteGroup(g.id);
          });
          
          groupContainer.appendChild(el);

          // Add to filter dropdown
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          opt.selected = (g.id === currentFilter);
          filterSelect.appendChild(opt);
        });
      }

      function renderPeopleList() {
        peopleList.innerHTML = '';
        const assignedIds = new Set(state.seats.filter(s => s.personId).map(s => s.personId));
        const filterId = state.peopleFilterGroupId || 'all';
        
        const unassigned = state.people.filter(p => {
          const isUnassigned = !assignedIds.has(p.id);
          const matchesFilter = (filterId === 'all' || p.groupId === filterId);
          return isUnassigned && matchesFilter;
        });

        if (unassigned.length === 0) {
          const msg = state.people.length === 0 ? '暂无人员' : (filterId === 'all' ? '所有人员已入座' : '该分组下无待分配人员');
          peopleList.innerHTML = `<div style="color:#ccc;font-size:13px;padding:20px;text-align:center;">${msg}</div>`;
        }

        // Group unassigned people by group if showing all, otherwise just list them
        const groupsToRender = filterId === 'all' ? state.groups : state.groups.filter(g => g.id === filterId);
        
        groupsToRender.forEach(g => {
          const groupPeople = unassigned.filter(p => p.groupId === g.id);
          if (groupPeople.length === 0) return;
          
          const section = document.createElement('div');
          section.style.width = '100%';
          if (filterId === 'all') {
            section.innerHTML = `<div style="font-size:11px; color:#999; margin: 4px 0 2px 4px;">${escHtml(g.name)}</div>`;
          }
          
          groupPeople.forEach(p => {
            const card = document.createElement('div');
            card.className = 'person-card';
            card.dataset.personId = p.id;
            card.innerHTML = `
              <span class="color-dot" style="background:${g.color}" title="点击切换分组"></span>
              <span class="name">${escHtml(p.name)}</span>
              <span class="delete-person" data-action="delete-person" title="删除人员">×</span>
            `;
            card.addEventListener('pointerdown', onPersonPointerDown);
            
            // Interaction to edit person's group
            card.querySelector('.color-dot').addEventListener('click', (e) => {
              e.stopPropagation();
              showMoveToGroupPopup(p.id, e.currentTarget);
            });
            
            card.querySelector('.delete-person').addEventListener('click', (e) => {
              e.stopPropagation();
              deletePerson(p.id);
            });
            section.appendChild(card);
          });
          peopleList.appendChild(section);
        });
        updatePeopleCount();
      }

      function renderStaging() {
        const seatsContainer = $('#staging-seats');
        seatsContainer.innerHTML = '';
        for (const o of SEAT_ORIENTATIONS) {
          const el = document.createElement('div');
          el.className = 'staging-seat';
          el.style.transform = `rotate(${o.cssDeg}deg)`;
          el.textContent = o.label;
          el.dataset.stagingType = 'seat';
          el.dataset.orientation = o.deg;
          el.addEventListener('pointerdown', onStagingPointerDown);
          seatsContainer.appendChild(el);
        }

        const obsContainer = $('#staging-obstacles');
        obsContainer.innerHTML = '';
        for (const t of OBSTACLE_TEMPLATES) {
          const el = document.createElement('div');
          el.className = 'staging-obstacle';
          el.style.width = (t.w * 20) + 'px';
          el.style.height = (t.h * 20) + 'px';
          el.textContent = t.label;
          el.dataset.stagingType = 'obstacle';
          el.dataset.obsW = t.w;
          el.dataset.obsH = t.h;
          el.addEventListener('pointerdown', onStagingPointerDown);
          obsContainer.appendChild(el);
        }
      }

      function renderWorkspace() {
        // Remove existing items
        gridArea.querySelectorAll('.ws-seat,.ws-obstacle,.drop-indicator').forEach(el => el.remove());

        for (const s of state.seats) {
          const el = createSeatElement(s);
          if (selectedIds.has(s.id)) el.classList.add('selected');
          gridArea.appendChild(el);
        }

        for (const o of state.obstacles) {
          const el = createObstacleElement(o);
          if (selectedIds.has(o.id)) el.classList.add('selected');
          gridArea.appendChild(el);
        }

        updateEmptyHint();
        updatePeopleCount();
        updateGridSize();
      }

      function createSeatElement(s) {
        const el = document.createElement('div');
        el.className = 'ws-seat';
        const size = getSeatSize(s.orientation);

        // If rotated 90 or 270 deg, we need to offset the top-left to keep the visual bounding box at (s.x, s.y)
        let renderX = s.x;
        let renderY = s.y;
        if (s.orientation === 90 || s.orientation === 270) {
          const offset = (SEAT_W - SEAT_H) / 2;
          renderX -= offset;
          renderY += offset;
        }

        el.style.left = renderX + 'px';
        el.style.top = renderY + 'px';
        el.style.transform = `rotate(${s.orientation}deg)`;
        el.dataset.seatId = s.id;

        const back = document.createElement('div');
        back.className = 'seat-back';
        el.appendChild(back);

        const cushion = document.createElement('div');
        cushion.className = 'seat-cushion';
        el.appendChild(cushion);

        if (s.personId) {
          const person = getPerson(s.personId);
          if (person) {
            const group = getGroup(person.groupId);
            const label = document.createElement('div');
            label.className = 'person-label';
            label.textContent = person.name;
            label.style.background = group.color;
            label.style.color = getContrastColor(group.color);
            label.style.transform = `translate(-50%, -50%) rotate(${-s.orientation}deg)`;
            label.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              onAssignedSeatPointerDown(e, s.id);
            });
            el.appendChild(label);
          }
        }

        el.addEventListener('pointerdown', (e) => { onObjectPointerDown(e, s.id, 'seat'); });
        el.addEventListener('contextmenu', (e) => { onObjectContextMenu(e, s.id, 'seat'); });
        
        addQuickAddArrows(el, s, 'seat');
        return el;
      }

      function createObstacleElement(o) {
        const el = document.createElement('div');
        el.className = 'ws-obstacle';
        el.style.left = o.x + 'px';
        el.style.top = o.y + 'px';
        el.style.width = o.w + 'px';
        el.style.height = o.h + 'px';
        el.dataset.obsId = o.id;

        const name = document.createElement('span');
        name.className = 'obs-name';
        name.textContent = o.name || '障碍物';
        name.contentEditable = 'false';
        el.appendChild(name);

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const obs = state.obstacles.find(ob => ob.id === o.id);
          if (!obs) return;
          const input = document.createElement('input');
          input.className = 'obs-edit-input';
          input.value = obs.name || '';
          input.addEventListener('blur', () => {
            obs.name = input.value.trim() || '障碍物';
            input.remove();
            saveState();
            renderWorkspace();
          });
          input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') input.blur();
            if (ev.key === 'Escape') { input.remove(); renderWorkspace(); }
          });
          el.appendChild(input);
          input.focus();
          input.select();
        });

        el.addEventListener('pointerdown', (e) => { onObjectPointerDown(e, o.id, 'obstacle'); });
        el.addEventListener('contextmenu', (e) => { onObjectContextMenu(e, o.id, 'obstacle'); });
        
        addQuickAddArrows(el, o, 'obstacle');
        return el;
      }

      function renderAll() {
        renderGroupList();
        renderPeopleList();
        renderWorkspace();
        // Recalculate collapsible panel heights after content update
        if (window._refreshPanelHeights) window._refreshPanelHeights();
        // Staging doesn't change
      }

      // ── Quick Add Arrows Logic ──
      function addQuickAddArrows(el, obj, itemType) {
        const container = document.createElement('div');
        container.className = 'quick-add-container';
        
        const directions = ['up', 'right', 'down', 'left'];
        directions.forEach(dir => {
          const arrow = document.createElement('div');
          arrow.className = `quick-arrow ${dir}`;
          arrow.innerHTML = dir === 'up' ? '↑' : dir === 'right' ? '→' : dir === 'down' ? '↓' : '←';
          
          arrow.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            quickCopyObject(obj, itemType, dir);
          });
          
          container.appendChild(arrow);
        });
        
        el.appendChild(container);
        
        el.addEventListener('mouseenter', () => {
          const size = getObjectSize(obj);
          // Set container size to match bounding box and counter-rotate
          container.style.width = size.w + 'px';
          container.style.height = size.h + 'px';
          container.style.transform = `translate(-50%, -50%) rotate(${-obj.orientation || 0}deg)`;
          
          const arrows = container.querySelectorAll('.quick-arrow');
          arrows.forEach(arrow => {
            const dir = arrow.classList.contains('up') ? 'up' : 
                        arrow.classList.contains('right') ? 'right' : 
                        arrow.classList.contains('down') ? 'down' : 'left';
            
            let nx = obj.x, ny = obj.y;
            if (dir === 'up') ny -= size.h;
            else if (dir === 'down') ny += size.h;
            else if (dir === 'left') nx -= size.w;
            else if (dir === 'right') nx += size.w;
            
            if (!checkCollision(nx, ny, size.w, size.h, null)) {
              arrow.style.display = 'flex';
            } else {
              arrow.style.display = 'none';
            }
          });
        });
      }

      function quickCopyObject(obj, itemType, dir) {
        const size = getObjectSize(obj);
        let nx = obj.x, ny = obj.y;
        if (dir === 'up') ny -= size.h;
        else if (dir === 'down') ny += size.h;
        else if (dir === 'left') nx -= size.w;
        else if (dir === 'right') nx += size.w;

        if (itemType === 'seat') {
          state.seats.push({
            id: genId(),
            x: nx,
            y: ny,
            orientation: obj.orientation,
            personId: null,
          });
        } else {
          state.obstacles.push({
            id: genId(),
            x: nx,
            y: ny,
            w: obj.w,
            h: obj.h,
            name: obj.name,
          });
        }
        saveState();
        renderWorkspace();
      }

      // ── Drag System ──
      function startDrag(type, data, e) {
        const ghost = dragGhost;
        ghost.style.display = 'block';

        if (type === 'person' || type === 'assigned-person') {
          const person = data.person;
          const group = getGroup(person.groupId);
          ghost.className = 'person-ghost';
          ghost.style.background = group.color;
          ghost.style.color = getContrastColor(group.color);
          ghost.textContent = person.name;
          ghost.style.width = 'auto'; ghost.style.height = 'auto';
          ghost.style.borderRadius = '20px';
        } else if (type === 'seat-template') {
          ghost.className = 'seat-ghost';
          ghost.style.width = SEAT_W + 'px';
          ghost.style.height = SEAT_H + 'px';
          ghost.style.transform = `rotate(${data.orientation}deg)`;
          ghost.textContent = '';
        } else if (type === 'obstacle-template') {
          ghost.className = 'obstacle-ghost';
          ghost.style.width = (data.w * CELL) + 'px';
          ghost.style.height = (data.h * CELL) + 'px';
          ghost.style.transform = '';
          ghost.textContent = '';
        } else if (type === 'object-move') {
          const obj = data.obj;
          if (data.itemType === 'seat') {
            ghost.className = 'seat-ghost';
            ghost.style.width = SEAT_W + 'px';
            ghost.style.height = SEAT_H + 'px';
            ghost.style.transform = `rotate(${obj.orientation}deg)`;
          } else {
            ghost.className = 'obstacle-ghost';
            ghost.style.width = obj.w + 'px';
            ghost.style.height = obj.h + 'px';
            ghost.style.transform = '';
          }
          ghost.textContent = '';
        }

        let offsetX = 0, offsetY = 0;
        if (type === 'seat-template') {
          const size = getSeatSize(data.orientation);
          offsetX = size.w / 2;
          offsetY = size.h / 2;
        } else if (type === 'obstacle-template') {
          offsetX = (data.w * CELL) / 2;
          offsetY = (data.h * CELL) / 2;
        } else if (type === 'object-move') {
          const rect = gridArea.getBoundingClientRect();
          offsetX = e.clientX - rect.left + workspace.scrollLeft - data.obj.x;
          offsetY = e.clientY - rect.top + workspace.scrollTop - data.obj.y;
        }

        drag = { type, data, ghostEl: ghost, sourceSeatId: data.sourceSeatId || null, offsetX, offsetY };
        moveGhost(e);
        e.preventDefault();
      }

      function moveGhost(e) {
        if (!drag) return;
        if (drag.type === 'batch-move') {
          const dx = e.clientX - drag.startMouseX;
          const dy = e.clientY - drag.startMouseY;
          const gridDx = Math.round(dx / CELL) * CELL;
          const gridDy = Math.round(dy / CELL) * CELL;
          
          drag.items.forEach(item => {
            const el = gridArea.querySelector(`[data-seat-id="${item.id}"], [data-obs-id="${item.id}"]`);
            if (el) {
              const size = getObjectSize(item.obj);
              let renderX = item.startX + gridDx;
              let renderY = item.startY + gridDy;
              if (item.type === 'seat' && (item.obj.orientation === 90 || item.obj.orientation === 270)) {
                const offset = (SEAT_W - SEAT_H) / 2;
                renderX -= offset;
                renderY += offset;
              }
              el.style.left = renderX + 'px';
              el.style.top = renderY + 'px';
            }
          });
          return;
        }

        const ghost = drag.ghostEl;
        const gx = e.clientX, gy = e.clientY;

        let renderX = gx - drag.offsetX;
        let renderY = gy - drag.offsetY;

        // For seats, if rotated 90/270, we need the same offset as in createSeatElement
        if (drag.type === 'object-move' || drag.type === 'seat-template') {
          const orientation = drag.type === 'object-move'
            ? (drag.data.itemType === 'seat' ? drag.data.obj.orientation : null)
            : drag.data.orientation;
          if (orientation === 90 || orientation === 270) {
            const offset = (SEAT_W - SEAT_H) / 2;
            renderX -= offset;
            renderY += offset;
          }
        } else if (drag.type === 'person' || drag.type === 'assigned-person') {
          // Person ghost should be centered on mouse
          renderX = gx;
          renderY = gy;
          ghost.style.transform = 'translate(-50%, -50%)';
        }

        ghost.style.left = renderX + 'px';
        ghost.style.top = renderY + 'px';

        // Auto-scroll workspace when near edges
        const wsRect = workspace.getBoundingClientRect();
        const edge = 40;
        const speed = 12;
        if (gx > wsRect.right - edge && workspace.scrollLeft < workspace.scrollWidth - workspace.clientWidth) {
          workspace.scrollLeft += speed;
        } else if (gx < wsRect.left + edge && workspace.scrollLeft > 0) {
          workspace.scrollLeft -= speed;
        }
        if (gy > wsRect.bottom - edge && workspace.scrollTop < workspace.scrollHeight - workspace.clientHeight) {
          workspace.scrollTop += speed;
        } else if (gy < wsRect.top + edge && workspace.scrollTop > 0) {
          workspace.scrollTop -= speed;
        }

        // Highlight drop target if applicable
        clearHighlights();
        if (drag.type === 'person' || drag.type === 'assigned-person') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const seat = findSeatAt(gridPos.x, gridPos.y);
          if (seat) {
            const el = gridArea.querySelector(`[data-seat-id="${seat.id}"]`);
            if (el) el.classList.add('highlight');
          }
        } else if (drag.type === 'seat-template') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const size = getSeatSize(drag.data.orientation);
          if (isInWorkspace(e)) {
            showDropIndicator(gridPos.x, gridPos.y, size.w, size.h,
              !checkCollision(gridPos.x, gridPos.y, size.w, size.h, null));
          } else {
            hideDropIndicator();
          }
        } else if (drag.type === 'obstacle-template') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const ow = drag.data.w * CELL;
          const oh = drag.data.h * CELL;
          if (isInWorkspace(e)) {
            showDropIndicator(gridPos.x, gridPos.y, ow, oh,
              !checkCollision(gridPos.x, gridPos.y, ow, oh, null));
          } else {
            hideDropIndicator();
          }
        } else if (drag.type === 'custom-obstacle-create') {
          const gridPos = clientToGrid(e);
          const x = Math.min(drag.data.startX, gridPos.x);
          const y = Math.min(drag.data.startY, gridPos.y);
          const w = Math.max(Math.abs(gridPos.x - drag.data.startX), CELL);
          const h = Math.max(Math.abs(gridPos.y - drag.data.startY), CELL);
          if (isInWorkspace(e)) {
            showDropIndicator(x, y, w, h,
              !checkCollision(x, y, w, h, null));
          } else {
            hideDropIndicator();
          }
        } else if (drag.type === 'object-move') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const obj = drag.data.obj;
          const size = getObjectSize(obj);
          const samePos = gridPos.x === obj.x && gridPos.y === obj.y;
          if (isInWorkspace(e)) {
            showDropIndicator(gridPos.x, gridPos.y, size.w, size.h,
              samePos || !checkCollision(gridPos.x, gridPos.y, size.w, size.h, obj.id));
          } else {
            hideDropIndicator();
          }
        }
      }

      function endDrag(e) {
        if (!drag) return;

        if (drag.type === 'batch-move') {
          const dx = e.clientX - drag.startMouseX;
          const dy = e.clientY - drag.startMouseY;
          const gridDx = Math.round(dx / CELL) * CELL;
          const gridDy = Math.round(dy / CELL) * CELL;
          
          if (gridDx === 0 && gridDy === 0) {
            cancelDrag();
            return;
          }

          const excludes = new Set(drag.items.map(it => it.obj.id));
          let collision = false;
          for (const item of drag.items) {
            const size = getObjectSize(item.obj);
            if (checkCollision(item.startX + gridDx, item.startY + gridDy, size.w, size.h, excludes)) {
              collision = true;
              break;
            }
          }
          
          if (!collision) {
            drag.items.forEach(item => {
              item.obj.x = item.startX + gridDx;
              item.obj.y = item.startY + gridDy;
            });
            saveState();
          } else {
            flashWorkspace();
          }
          cancelDrag();
          return;
        }

        if (drag.type === 'person') {
          const person = drag.data.person;
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const seat = findSeatAt(gridPos.x, gridPos.y);
          if (seat && !seat.personId) {
            // Assign person to empty seat
            seat.personId = person.id;
            saveState();
            renderAll();
          } else if (seat && seat.personId && seat.personId !== person.id) {
            // Swap: person goes to this seat, existing person goes to... waiting list if dragged from list
            const existingPersonId = seat.personId;
            seat.personId = person.id;
            if (drag.sourceSeatId) {
              // Person was dragged from another seat - put existing person there
              const sourceSeat = state.seats.find(s => s.id === drag.sourceSeatId);
              if (sourceSeat) sourceSeat.personId = existingPersonId;
            }
            // else: person dragged from waiting list, existing person goes to waiting list (no-op since they're already unassigned)
            saveState();
            renderAll();
          } else if (seat && seat.personId === person.id) {
            // Dropped on own seat - do nothing (but they were removed, so re-add)
            seat.personId = person.id;
            saveState();
            renderAll();
          } else {
            // Dropped outside any seat - if dragged from a seat, person stays unassigned
            // if dragged from waiting list, person stays unassigned
            saveState();
            renderAll();
          }
        } else if (drag.type === 'assigned-person') {
          const person = drag.data.person;
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const seat = findSeatAt(gridPos.x, gridPos.y);
          const sourceSeatId = drag.sourceSeatId;

          if (seat && seat.id === sourceSeatId) {
            // Dropped back on own seat - re-assign
            seat.personId = person.id;
            saveState();
            renderAll();
          } else if (seat && !seat.personId) {
            // Move to empty seat
            seat.personId = person.id;
            saveState();
            renderAll();
          } else if (seat && seat.personId) {
            // Swap
            const existingPersonId = seat.personId;
            seat.personId = person.id;
            const sourceSeat = state.seats.find(s => s.id === sourceSeatId);
            if (sourceSeat) sourceSeat.personId = existingPersonId;
            saveState();
            renderAll();
          } else {
            // Dropped outside - person stays unassigned (already removed from seat in startDrag)
            saveState();
            renderAll();
          }
        } else if (drag.type === 'seat-template') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const size = getSeatSize(drag.data.orientation);
          if (isInWorkspace(e)) {
            if (!checkCollision(gridPos.x, gridPos.y, size.w, size.h, null, null)) {
              state.seats.push({
                id: genId(),
                x: gridPos.x,
                y: gridPos.y,
                orientation: drag.data.orientation,
                personId: null,
              });
              saveState();
            } else {
              flashWorkspace();
            }
          }
          renderWorkspace();
        } else if (drag.type === 'obstacle-template') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const ow = drag.data.w * CELL;
          const oh = drag.data.h * CELL;
          if (isInWorkspace(e)) {
            if (!checkCollision(gridPos.x, gridPos.y, ow, oh, null)) {
              state.obstacles.push({
                id: genId(),
                x: gridPos.x,
                y: gridPos.y,
                w: ow,
                h: oh,
                name: '障碍物 ' + (state.obstacles.length + 1),
              });
              saveState();
            } else {
              flashWorkspace();
            }
          }
          renderWorkspace();
        } else if (drag.type === 'custom-obstacle-create') {
          const gridPos = clientToGrid(e);
          const x = Math.min(drag.data.startX, gridPos.x);
          const y = Math.min(drag.data.startY, gridPos.y);
          const w = Math.max(Math.abs(gridPos.x - drag.data.startX), CELL);
          const h = Math.max(Math.abs(gridPos.y - drag.data.startY), CELL);
          if (isInWorkspace(e)) {
            if (!checkCollision(x, y, w, h, null)) {
              state.obstacles.push({
                id: genId(), x, y, w, h,
                name: '障碍物 ' + (state.obstacles.length + 1),
              });
              saveState();
            } else {
              flashWorkspace();
            }
          }
          renderWorkspace();
        } else if (drag.type === 'object-move') {
          const gridPos = clientToGrid(e, drag.offsetX, drag.offsetY);
          const obj = drag.data.obj;
          const size = getObjectSize(obj);
          const samePos = gridPos.x === obj.x && gridPos.y === obj.y;
          if (isInWorkspace(e) && !samePos) {
            if (!checkCollision(gridPos.x, gridPos.y, size.w, size.h, obj.id)) {
              obj.x = gridPos.x;
              obj.y = gridPos.y;
              saveState();
            } else {
              flashWorkspace();
            }
          }
          renderWorkspace();
        }

        cancelDrag();
      }

      function cancelDrag() {
        dragGhost.style.display = 'none';
        dragGhost.className = '';
        dragGhost.textContent = '';
        dragGhost.style.width = ''; dragGhost.style.height = '';
        dragGhost.style.borderRadius = '';
        dragGhost.style.background = '';
        dragGhost.style.color = '';
        dragGhost.style.transform = '';
        clearHighlights();
        hideDropIndicator();
        drag = null;
        renderAll();
      }

      function clearHighlights() {
        gridArea.querySelectorAll('.ws-seat.highlight').forEach(el => el.classList.remove('highlight'));
      }

      function showDropIndicator(x, y, w, h, valid) {
        hideDropIndicator();
        const el = document.createElement('div');
        el.className = 'drop-indicator';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        if (!valid) el.style.borderColor = '#e74c3c';
        gridArea.appendChild(el);
      }

      function hideDropIndicator() {
        const el = gridArea.querySelector('.drop-indicator');
        if (el) el.remove();
      }

      function flashWorkspace() {
        gridArea.classList.add('flash-red');
        setTimeout(() => gridArea.classList.remove('flash-red'), 400);
      }

      // ── Coordinate helpers ──
      function clientToGrid(e, offsetX = 0, offsetY = 0) {
        const rect = gridArea.getBoundingClientRect();
        const scrollLeft = workspace.scrollLeft;
        const scrollTop = workspace.scrollTop;
        const rawX = e.clientX - rect.left + scrollLeft - offsetX;
        const rawY = e.clientY - rect.top + scrollTop - offsetY;
        return {
          x: Math.round(rawX / CELL) * CELL,
          y: Math.round(rawY / CELL) * CELL,
        };
      }

      function isInWorkspace(e) {
        const rect = gridArea.getBoundingClientRect();
        return e.clientX >= rect.left && e.clientX <= rect.right &&
          e.clientY >= rect.top && e.clientY <= rect.bottom;
      }

      // ── Custom obstacle mode ──
      function toggleCustomObsMode() {
        customObsMode = !customObsMode;
        const btn = document.getElementById('btn-custom-obs');
        const hint = document.getElementById('custom-mode-hint');
        if (customObsMode) {
          btn.classList.add('active');
          gridArea.classList.add('custom-mode');
          hint.style.display = 'flex';
        } else {
          btn.classList.remove('active');
          gridArea.classList.remove('custom-mode');
          hint.style.display = 'none';
        }
      }

      function exitCustomObsMode() {
        if (!customObsMode) return;
        customObsMode = false;
        const btn = document.getElementById('btn-custom-obs');
        const hint = document.getElementById('custom-mode-hint');
        btn.classList.remove('active');
        gridArea.classList.remove('custom-mode');
        hint.style.display = 'none';
      }

      // ── Event Handlers ──
      function onPersonPointerDown(e) {
        if (e.button !== 0) return;
        if (e.target.dataset.action === 'delete-person') return; // don't drag when clicking delete
        const card = e.currentTarget;
        const personId = card.dataset.personId;
        const person = getPerson(personId);
        if (!person) return;
        startDrag('person', { person, sourceSeatId: null }, e);
      }

      function onAssignedSeatPointerDown(e, seatId) {
        if (e.button !== 0) return;
        e.stopPropagation();
        const seat = state.seats.find(s => s.id === seatId);
        if (!seat || !seat.personId) return;
        const person = getPerson(seat.personId);
        if (!person) return;

        // Remove person from seat temporarily
        seat.personId = null;
        renderWorkspace();

        startDrag('assigned-person', { person, sourceSeatId: seatId }, e);
      }

      function onObjectPointerDown(e, id, itemType) {
        if (e.button !== 0) return;
        e.stopPropagation();

        if (e.shiftKey) {
          if (selectedIds.has(id)) selectedIds.delete(id);
          else selectedIds.add(id);
          renderWorkspace();
          return;
        }

        if (!selectedIds.has(id)) {
          selectedIds.clear();
          selectedIds.add(id);
          renderWorkspace();
        }

        const obj = (itemType === 'seat')
          ? state.seats.find(s => s.id === id)
          : state.obstacles.find(o => o.id === id);
        if (!obj) return;

        if (selectedIds.size > 1) {
          const items = [];
          selectedIds.forEach(sid => {
            const s = state.seats.find(x => x.id === sid);
            if (s) items.push({ type: 'seat', obj: s, id: s.id });
            const o = state.obstacles.find(x => x.id === sid);
            if (o) items.push({ type: 'obstacle', obj: o, id: o.id });
          });
          
          drag = { 
            type: 'batch-move', 
            items: items.map(it => ({ ...it, startX: it.obj.x, startY: it.obj.y })),
            startMouseX: e.clientX,
            startMouseY: e.clientY
          };
          items.forEach(it => {
            const el = gridArea.querySelector(`[data-seat-id="${it.id}"], [data-obs-id="${it.id}"]`);
            if (el) el.style.opacity = '0.6';
          });
        } else {
          const el = e.currentTarget;
          el.style.opacity = '0'; // Hide original while dragging
          startDrag('object-move', { obj, itemType, el }, e);
        }
      }

      function onStagingPointerDown(e) {
        if (e.button !== 0) return;
        e.stopPropagation();
        const el = e.currentTarget;
        const type = el.dataset.stagingType;
        if (type === 'seat') {
          const orientation = parseInt(el.dataset.orientation);
          startDrag('seat-template', { orientation }, e);
        } else if (type === 'obstacle') {
          const w = parseInt(el.dataset.obsW);
          const h = parseInt(el.dataset.obsH);
          startDrag('obstacle-template', { w, h }, e);
        }
      }

      function onGridPointerDown(e) {
        if (e.button !== 0) return;

        if (customObsMode) {
          const gridPos = clientToGrid(e);
          startDrag('custom-obstacle-create', { startX: gridPos.x, startY: gridPos.y }, e);
          return;
        }

        selectedIds.clear();
        renderWorkspace();
        
        const rect = gridArea.getBoundingClientRect();
        const startX = e.clientX - rect.left + workspace.scrollLeft;
        const startY = e.clientY - rect.top + workspace.scrollTop;
        
        marquee = { startX, startY };
        selectionMarquee.style.left = startX + 'px';
        selectionMarquee.style.top = startY + 'px';
        selectionMarquee.style.width = '0px';
        selectionMarquee.style.height = '0px';
        selectionMarquee.style.display = 'block';
      }

      function onObjectContextMenu(e, id, itemType) {
        e.preventDefault();
        if (itemType === 'seat') {
          state.seats = state.seats.filter(s => s.id !== id);
        } else {
          state.obstacles = state.obstacles.filter(o => o.id !== id);
        }
        saveState();
        renderAll();
      }

      // ── Color Edit Popup ──
      let colorEditPopup = null;

      function showColorEditPopup(targetId, dotEl, type) {
        hideColorEditPopup();
        let target, used;
        if (type === 'group') {
          target = getGroup(targetId);
          used = getUsedGroupColors(targetId);
        } else {
          target = getPerson(targetId);
          used = new Set();
        }
        if (!target) return;

        const available = PERSON_COLORS.filter(c => !used.has(c) || c === target.color);

        const popup = document.createElement('div');
        popup.className = 'color-edit-popup';
        const rect = dotEl.getBoundingClientRect();
        popup.style.left = rect.left + 'px';
        popup.style.top = (rect.bottom + 4) + 'px';

        for (const c of available) {
          const dot = document.createElement('span');
          dot.className = 'color-dot-opt' + (c === target.color ? ' selected' : '');
          dot.style.background = c;
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            target.color = c;
            saveState();
            renderAll();
            hideColorEditPopup();
          });
          popup.appendChild(dot);
        }
        document.body.appendChild(popup);
        colorEditPopup = popup;
      }

      function hideColorEditPopup() {
        if (colorEditPopup) { colorEditPopup.remove(); colorEditPopup = null; }
      }

      // ── Move to Group Popup ──
      let groupSelectPopup = null;

      function showMoveToGroupPopup(personId, dotEl) {
        hideMoveToGroupPopup();
        const person = getPerson(personId);
        if (!person) return;

        const popup = document.createElement('div');
        popup.className = 'group-select-popup';
        const rect = dotEl.getBoundingClientRect();
        popup.style.left = rect.left + 'px';
        popup.style.top = (rect.bottom + 4) + 'px';

        state.groups.forEach(g => {
          const item = document.createElement('div');
          item.className = 'group-select-item' + (person.groupId === g.id ? ' active' : '');
          item.innerHTML = `
            <span class="color-dot" style="background:${g.color}"></span>
            <span style="flex:1">${escHtml(g.name)}</span>
          `;
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            person.groupId = g.id;
            saveState();
            renderAll();
            hideMoveToGroupPopup();
          });
          popup.appendChild(item);
        });

        document.body.appendChild(popup);
        groupSelectPopup = popup;
      }

      function hideMoveToGroupPopup() {
        if (groupSelectPopup) { groupSelectPopup.remove(); groupSelectPopup = null; }
      }

      // Context menu removed

      // ── Global pointer events ──
      document.addEventListener('pointermove', (e) => {
        lastPointerEvent = e;
        if (drag) moveGhost(e);
        if (marquee) {
          const rect = gridArea.getBoundingClientRect();
          const currentX = e.clientX - rect.left + workspace.scrollLeft;
          const currentY = e.clientY - rect.top + workspace.scrollTop;
          
          const x = Math.min(marquee.startX, currentX);
          const y = Math.min(marquee.startY, currentY);
          const w = Math.abs(marquee.startX - currentX);
          const h = Math.abs(marquee.startY - currentY);
          
          selectionMarquee.style.left = x + 'px';
          selectionMarquee.style.top = y + 'px';
          selectionMarquee.style.width = w + 'px';
          selectionMarquee.style.height = h + 'px';
          
          const mRect = { x, y, w, h };
          selectedIds.clear();
          
          // Efficiently update selection classes without full rerender
          gridArea.querySelectorAll('.ws-seat, .ws-obstacle').forEach(el => {
            const sid = el.dataset.seatId;
            const oid = el.dataset.obsId;
            const id = sid || oid;
            const type = sid ? 'seat' : 'obstacle';
            const obj = (type === 'seat') 
              ? state.seats.find(s => s.id === id)
              : state.obstacles.find(o => o.id === id);
            
            if (obj && rectsOverlap(mRect, getObjectRect(obj))) {
              el.classList.add('selected');
              selectedIds.add(id);
            } else {
              el.classList.remove('selected');
            }
          });
        }
      });

      document.addEventListener('pointerup', (e) => {
        if (drag) endDrag(e);
        if (marquee) {
          marquee = null;
          selectionMarquee.style.display = 'none';
        }
      });



      // Cancel drag on Escape, Rotate on R
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
        
        if (e.key === 'Escape') {
          if (drag) {
            // If dragging an assigned person, re-assign them to their source seat
            if (drag.type === 'assigned-person' && drag.sourceSeatId) {
              const seat = state.seats.find(s => s.id === drag.sourceSeatId);
              if (seat) seat.personId = drag.data.person.id;
            }
            cancelDrag();
            renderAll();
          } else {
            selectedIds.clear();
            renderWorkspace();
          }
          if (customObsMode) exitCustomObsMode();
        } else if (e.key.toLowerCase() === 'r') {
          if (drag) {
            let orientation = null;
            if (drag.type === 'seat-template') {
              drag.data.orientation = (drag.data.orientation + 90) % 360;
              orientation = drag.data.orientation;
            } else if (drag.type === 'object-move' && drag.itemType === 'seat') {
              drag.data.obj.orientation = (drag.data.obj.orientation + 90) % 360;
              orientation = drag.data.obj.orientation;
            }
            
            if (orientation !== null) {
              dragGhost.style.transform = `rotate(${orientation}deg)`;
              const size = getSeatSize(orientation);
              drag.offsetX = size.w / 2;
              drag.offsetY = size.h / 2;
              if (lastPointerEvent) moveGhost(lastPointerEvent);
            } else if (drag.type === 'object-move' && drag.itemType === 'obstacle') {
              const obs = drag.data.obj;
              if (obs.w !== obs.h) {
                const temp = obs.w; obs.w = obs.h; obs.h = temp;
                dragGhost.style.width = obs.w + 'px';
                dragGhost.style.height = obs.h + 'px';
                drag.offsetX = obs.w / 2;
                drag.offsetY = obs.h / 2;
                if (lastPointerEvent) moveGhost(lastPointerEvent);
              }
            } else if (drag.type === 'obstacle-template') {
              const obs = drag.data;
              if (obs.w !== obs.h) {
                const temp = obs.w; obs.w = obs.h; obs.h = temp;
                dragGhost.style.width = (obs.w * CELL) + 'px';
                dragGhost.style.height = (obs.h * CELL) + 'px';
                drag.offsetX = (obs.w * CELL) / 2;
                drag.offsetY = (obs.h * CELL) / 2;
                if (lastPointerEvent) moveGhost(lastPointerEvent);
              }
            }
          } else {
            const hoveredSeat = document.querySelector('.ws-seat:hover');
            if (hoveredSeat) {
              const id = hoveredSeat.dataset.seatId;
              const seat = state.seats.find(s => s.id === id);
              if (seat) {
                const oldOri = seat.orientation;
                seat.orientation = (seat.orientation + 90) % 360;
                const newSize = getSeatSize(seat.orientation);
                if (checkCollision(seat.x, seat.y, newSize.w, newSize.h, seat.id)) {
                  seat.orientation = oldOri; // revert
                  hoveredSeat.classList.add('flash-red');
                  setTimeout(() => hoveredSeat.classList.remove('flash-red'), 400);
                } else {
                  saveState();
                  renderWorkspace();
                }
              }
              return;
            }
            
            const hoveredObs = document.querySelector('.ws-obstacle:hover');
            if (hoveredObs) {
              const id = hoveredObs.dataset.obsId;
              const obs = state.obstacles.find(o => o.id === id);
              if (obs && obs.w !== obs.h) {
                if (checkCollision(obs.x, obs.y, obs.h, obs.w, obs.id)) {
                  hoveredObs.classList.add('flash-red');
                  setTimeout(() => hoveredObs.classList.remove('flash-red'), 400);
                } else {
                  const temp = obs.w;
                  obs.w = obs.h;
                  obs.h = temp;
                  saveState();
                  renderWorkspace();
                }
              }
            }
          }
        }
      });

      // Hide popups on click elsewhere
      document.addEventListener('click', (e) => {
        if (colorEditPopup && !colorEditPopup.contains(e.target) && !e.target.closest('.color-dot')) hideColorEditPopup();
        if (groupSelectPopup && !groupSelectPopup.contains(e.target) && !e.target.closest('.color-dot')) hideMoveToGroupPopup();
      });

      // Prevent default drag behaviors
      document.addEventListener('dragstart', (e) => e.preventDefault());

      // ── People Management ──
      function addPerson(name) {
        if (!name.trim()) return;
        state.people.push({ id: genId(), name: name.trim(), groupId: state.activeGroupId });
        saveState();
        renderAll();
      }

      function deletePerson(personId) {
        // Remove person from any seat they occupy
        for (const s of state.seats) {
          if (s.personId === personId) s.personId = null;
        }
        state.people = state.people.filter(p => p.id !== personId);
        saveState();
        renderAll();
      }

      function batchAddPeople(raw) {
        const names = raw.split(/[\n,，]+/).map(s => s.trim()).filter(s => s.length > 0);
        if (names.length === 0) return;

        for (const name of names) {
          state.people.push({ id: genId(), name: name, groupId: state.activeGroupId });
        }
        saveState();
        renderAll();
      }

      function addGroup() {
        const usedColors = getUsedGroupColors();
        const color = PERSON_COLORS.find(c => !usedColors.has(c)) || PERSON_COLORS[0];
        const gid = genId();
        state.groups.push({ id: gid, name: '新分组', color });
        state.activeGroupId = gid;
        saveState();
        renderAll();
      }

      function deleteGroup(groupId) {
        if (state.groups.length <= 1) {
          alert('至少需要保留一个分组');
          return;
        }
        const count = state.people.filter(p => p.groupId === groupId).length;
        if (count > 0 && !confirm(`该分组下有 ${count} 名人员，删除分组将同时删除这些人员，确定吗？`)) return;
        
        // Remove people
        const peopleToRemove = state.people.filter(p => p.groupId === groupId);
        peopleToRemove.forEach(p => deletePerson(p.id));
        
        state.groups = state.groups.filter(g => g.id !== groupId);
        if (state.activeGroupId === groupId) state.activeGroupId = state.groups[0].id;
        saveState();
        renderAll();
      }

      function clearAllPeople() {
        if (!confirm('确定要清空所有人员吗？已入座的人员将被移出座位。')) return;
        for (const s of state.seats) s.personId = null;
        state.people = [];
        saveState();
        renderAll();
      }

      $('#btn-add-person').addEventListener('click', () => {
        if (state.peopleFilterGroupId === 'all') {
          alert('请先选择一个具体的分组再添加人员。');
          return;
        }
        addPerson(newPersonInput.value);
        newPersonInput.value = '';
        newPersonInput.focus();
      });

      newPersonInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (state.peopleFilterGroupId === 'all') {
            alert('请先选择一个具体的分组再添加人员。');
            return;
          }
          addPerson(newPersonInput.value);
          newPersonInput.value = '';
        }
      });

      // ── Batch Add ──
      function showBatchModal() {
        if (state.peopleFilterGroupId === 'all') {
          alert('请先在人员清单顶部的下拉框中选择一个具体的分组，再进行批量添加。');
          return;
        }
        document.getElementById('batch-modal').style.display = 'block';
        document.getElementById('batch-input').value = '';
        setTimeout(() => document.getElementById('batch-input').focus(), 100);
      }

      function hideBatchModal() {
        document.getElementById('batch-modal').style.display = 'none';
      }

      document.getElementById('btn-clear-people').addEventListener('click', clearAllPeople);
      document.getElementById('btn-batch-add').addEventListener('click', showBatchModal);
      document.getElementById('btn-batch-confirm').addEventListener('click', () => {
        batchAddPeople(document.getElementById('batch-input').value);
        hideBatchModal();
      });
      document.getElementById('btn-batch-cancel').addEventListener('click', hideBatchModal);
      document.getElementById('batch-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) hideBatchModal();
      });
      document.getElementById('batch-input').addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); hideBatchModal(); }
      });

      document.getElementById('btn-add-group').addEventListener('click', addGroup);

      // ── Toolbar buttons ──
      $('#btn-export').addEventListener('click', exportData);
      $('#btn-import').addEventListener('click', () => $('#import-file').click());
      $('#import-file').addEventListener('change', (e) => {
        if (e.target.files[0]) importData(e.target.files[0]);
        e.target.value = '';
      });
      $('#btn-clear').addEventListener('click', () => {
        if (confirm('确定要清空工作区吗？人员清单将保留。')) {
          state.seats = [];
          state.obstacles = [];
          saveState();
          renderAll();
        }
      });

      // ── Helpers ──
      function escHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function getContrastColor(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return (r * 0.299 + g * 0.587 + b * 0.114) > 150 ? '#333' : '#fff';
      }

      // ── Initialize ──
      function initPanels() {
        // Panel collapse toggles
        const peoplePanelHeader = $('#people-panel-header');
        const facilityPanelHeader = $('#facility-panel-header');
        const peoplePanel = $('#people-panel');
        const facilityPanel = $('#facility-panel');
        const peoplePanelBody = $('#people-panel-body');
        const facilityPanelBody = $('#facility-panel-body');

        function setPanelBodyMaxHeight(body) {
          const section = body.closest('.panel-section');
          if (section.classList.contains('people-panel')) {
            body.style.maxHeight = '800px'; 
          }
          // Facility panel is now purely CSS-driven for expansion
        }

        // Observe content changes to recalculate max-height
        function refreshPanelHeights() {
          requestAnimationFrame(() => {
            setPanelBodyMaxHeight(peoplePanelBody);
            setPanelBodyMaxHeight(facilityPanelBody);
          });
        }

        peoplePanelHeader.addEventListener('click', (e) => {
          if (e.target.closest('.header-btn')) return;
          peoplePanel.classList.toggle('collapsed');
          // No need to refresh heights if we use flex/constant high max-height for people panel
          refreshPanelHeights();
        });

        facilityPanelHeader.addEventListener('click', (e) => {
          if (e.target.closest('.header-btn')) return;
          facilityPanel.classList.toggle('collapsed');
          refreshPanelHeights();
        });

        // Sub-tab switching
        const subTabs = document.querySelectorAll('.sub-tab');
        subTabs.forEach(tab => {
          tab.addEventListener('click', () => {
            subTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
            const target = tab.dataset.tab === 'groups' ? '#sub-groups' : '#sub-people';
            $(target).classList.add('active');
            refreshPanelHeights();
          });
        });

        // Group Filter Logic
        const groupFilter = $('#people-group-filter');
        groupFilter.addEventListener('change', () => {
          state.peopleFilterGroupId = groupFilter.value;
          // When filtering a specific group, make it the active group for adding new members
          if (groupFilter.value !== 'all') {
            state.activeGroupId = groupFilter.value;
            renderGroupList(); // Update highlight in groups tab
          }
          saveState();
          renderPeopleList();
          refreshPanelHeights();
        });

        // Expose refreshPanelHeights for use after renders
        window._refreshPanelHeights = refreshPanelHeights;

        // Initial max-height set
        setTimeout(refreshPanelHeights, 50);
      }

      function init() {
        loadState();
        renderStaging();
        renderAll();
        initPanels();
        gridArea.addEventListener('pointerdown', onGridPointerDown);
        document.getElementById('btn-custom-obs').addEventListener('click', toggleCustomObsMode);
      }

      init();
    })();
  </script>
</body>
